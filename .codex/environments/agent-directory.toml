version = 1
name = "agent-directory"

[setup]
script = "bash tools/setup-local-environment.sh"

[[actions]]
name = "Validate changed"
icon = "test"
command = "bash tools/validate-agent-directory.sh --changed"

[[actions]]
name = "Validate full"
icon = "test"
command = "bash tools/validate-agent-directory.sh --full"

[[actions]]
name = "Git hook status"
icon = "debug"
command = "bash tools/install-git-hooks.sh --status"

[[actions]]
name = "GitHub auth status"
icon = "debug"
command = "bash tools/setup-github-auth.sh --check"

[[actions]]
name = "Runtime preflight"
icon = "debug"
command = "bash tools/check-runtime-readiness.sh"
