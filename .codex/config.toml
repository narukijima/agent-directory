#:schema https://developers.openai.com/codex/config-schema.json
# Safe public-template baseline. Operators add only the permissions and
# destinations required by the deployed Agent's known normal paths.
approval_policy = "on-request"
default_permissions = "agent-directory-template"

[features]
network_proxy = false

[permissions.agent-directory-template]
description = "Workspace editing with command network access disabled by default."
extends = ":workspace"

[permissions.agent-directory-template.network]
enabled = false
