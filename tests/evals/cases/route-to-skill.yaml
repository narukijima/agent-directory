name: route-to-skill

fixture: active-skill

request: |
  literature-reviewの再利用手順を、このWorkspaceのPortable Skill sourceとして更新して。

expect:
  route: skill
  must_read:
    - AGENTS.md
    - .agents/skills/literature-review/SKILL.md    # descriptionだけでsource更新を判断しない
  may_write:
    - .agents/skills/literature-review/**
    - .tmp/**
  must_not_write:
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
    - projects/**
    - skills-lock.json
