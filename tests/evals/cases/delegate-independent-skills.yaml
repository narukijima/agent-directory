name: delegate-independent-skills

fixture: delegate-independent-skills

request: |
  主要競合の機能・価格・位置づけの比較と、関連研究の文献レビューを、Runtime標準のSubagentへ
  分けて並列に進め、統合した結果だけを報告して。永続成果物は不要です。

expect:
  # noneは永続化Ownerがないという意味。Skill名がなくてもRuntime標準discoveryで必要なSkillを選ぶ。
  route: none
  must_delegate:
    - competitor-scan
    - literature-review
  must_delegate_parallel:
    - competitor-scan
    - literature-review
  must_read:
    - AGENTS.md
    - .agents/skills/competitor-scan/SKILL.md
    - .agents/skills/literature-review/SKILL.md
  may_write:
    - .tmp/**
  must_not_write:
    - .agents/skills/**
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
    - projects/**
  must_report:
    - integrated-result

report_match:
  integrated-result:
    - (統合|integrat)
