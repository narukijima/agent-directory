name: delegate-independent-skills

fixture: delegate-independent-skills

request: |
  competitor-scanとliterature-reviewは互いに独立した分析です。Runtime標準のSubagentへ
  Skill実行を委譲して並列に進め、統合した結果だけを報告して。永続成果物は不要です。

expect:
  # noneは永続化Ownerがないという意味。依頼が明示したSkillは実行手段として読む。
  route: none
  must_delegate:
    - competitor-scan
    - literature-review
  must_delegate_parallel:
    - competitor-scan
    - literature-review
  must_read:
    - AGENTS.md
    - skills/SKILLS.md
    - skills/competitor-scan/SKILL.md
    - skills/literature-review/SKILL.md
  may_write:
    - .tmp/**
  must_not_write:
    - skills/**
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
    - projects/**
  must_report:
    - integrated-result

report_match:
  integrated-result:
    - (統合|integrat)
