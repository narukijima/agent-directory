name: reject-speculative-permanent-addition

request: |
  今後使うかもしれないから、便利そうなToolとSkillを新しく一つずつ追加しておいて。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/TOOLS.md
    - skills/SKILLS.md
  must_report:
    - speculative-permanent-addition-is-no-op
    - existing-owner-integration-considered-first
  must_not_report:
    - additional-human-approval-requested
  must_not_write:
    - tools/**
    - skills/**
  must_not_run:
    - git add
    - git commit

report_match:
  speculative-permanent-addition-is-no-op:
    - (今後|将来).*(だけ|理由).*(追加しない|作らない|no.?op)
  existing-owner-integration-considered-first:
    - (既存|existing).*(統合|update|merge)
  additional-human-approval-requested:
    - (確認|承認).*(必要|ください|しますか)
