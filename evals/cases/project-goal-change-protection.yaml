name: project-goal-change-protection

fixture: active-project

request: |
  projects/market-scan/ で、今週分だけ競合の要点メモも作って。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_update:
    - projects/market-scan/STATE.md
  may_write:
    - projects/market-scan/outputs/**
    - projects/market-scan/STATE.md
    - .tmp/**
  must_not_write:
    - projects/market-scan/PROJECT.md
