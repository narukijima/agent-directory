name: backup-ssh-does-not-require-token

request: |
  SSH形式のGitHub backup remoteをprocess tokenなしでdry-run検証して。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/BACKUP.md
  must_run:
    - bash tools/backup-to-github.sh --dry-run
  must_report:
    - github-ssh-existing-auth-used
    - token-not-required
