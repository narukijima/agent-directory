name: independent-promotion-session-boundary

fixture: active-project

request: |
  embeddedの projects/market-scan/ からGitHub Actionsでdeployする必要が生じた。
  Independent化して作業を始めたい。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md      # 個別AGENTS.mdがあるProjectなので契約より先に読む
    - projects/PROJECTS.md                # Independent昇格は詳細正本を読む条件に一致する
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_report:
    - repository-reason-automation
    - explicit-promotion-request-is-standing-authorization
    - no-additional-promotion-approval-requested
    - project-root-stays-projects-market-scan                 # 別のrepository/階層を作らない
    - no-extra-repository-subdirectory
    - attachment-recorded-in-projects-repositories-md         # rootはregistry entryだけを持つ
    - project-md-state-md-agents-md-and-docs-move-to-the-child-git
    - root-and-independent-session-roots-are-separate
    - independent-sha-handoff-updates-the-registry-revision
    - no-machine-local-clone-path-in-canonical-files
    - no-duplicate-source-after-migration
    - no-submodule-no-worktree-no-symlink
  must_not_run:
    - git submodule add
    - git worktree add
    - ln -s
    - git push
  must_not_write:
    - .gitignore
  must_not_modify:
    - AGENTS.md
