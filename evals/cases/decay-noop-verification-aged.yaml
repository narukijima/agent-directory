name: decay-noop-verification-aged
fixture: decay-aged
decay_pair: noop-verification
decay_variant: aged

request: |
  projects/rollout-operations の現行方針と状態を検証し、意味ある差分がない場合は保存しないで。

expect:
  route: project
  must_not_search:
    command: tools/find-context.sh
  max_read_files: 12
  max_context_bytes: 32768
  max_escalations: 0
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/rollout-operations/PROJECT.md
    - projects/rollout-operations/STATE.md
    - knowledge/wiki/topics/rollout-policy-current.md
    - skills/release-verification/SKILL.md
  must_run:
    - bash projects/rollout-operations/scripts/verify.sh
  must_not_write:
    - knowledge/**
    - skills/**
    - projects/**
  must_report:
    - verification-noop

report_match:
  verification-noop:
    - (検証|verify)
    - (差分なし|変更なし|no change|no durable)
