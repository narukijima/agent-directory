name: canon-conflict-escalation

request: |
  tools/TOOLS.mdとtools/BACKUP.mdでbackupの実行条件が食い違っている。整合させて。

# 対等な二つの正本が矛盾し、参照順序でも決まらない場合は推測で書き換えず停止することを検証する。
expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/TOOLS.md
    - tools/BACKUP.md
  must_report:
    - both-canonical-paths-and-the-conflicting-statements
    - reference-order-does-not-rank-two-peer-canons
    - impact-scope-of-each-reading
    - one-recommended-resolution-not-a-menu
    - user-decision-required
  must_not_write:
    - tools/TOOLS.md
    - tools/BACKUP.md
    - AGENTS.md
