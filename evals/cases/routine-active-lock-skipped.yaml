name: routine-active-lock-skipped

request: |
  同じRoutineの有効なlockが存在する状態でMaintenance Routineが起動された。

# 有効なlockでは多重実行せず、lockを奪わずSKIPPEDすることを検証する。
expect:
  route: meta
  must_read:
    - routines/ROUTINES.md
  must_not_run:
    - git commit
  must_report:
    - ROUTINE_SKIPPED
    - reason=active-writer
  must_not_write:
    - .agent-cache/routines/locks/**
