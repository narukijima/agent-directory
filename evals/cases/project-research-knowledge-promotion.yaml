name: project-research-knowledge-promotion

fixture: docs-project

request: |
  projects/design-system/docs/research/color-contrast-study.md の内容を、
  Knowledgeにも入れて他のProjectから使えるようにしておいて。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/design-system/AGENTS.md
    - projects/design-system/PROJECT.md
    - projects/design-system/STATE.md
    - projects/design-system/docs/RESEARCH.md
    - projects/design-system/docs/research/color-contrast-study.md
  must_not_read:
    - projects/design-system/docs/PRODUCT_SENSE.md   # 昇格判断に不要なDomain Canonを読まない
  must_report:
    - promotion-criteria-not-met-scope-and-uncertainty-undetermined
  must_not_write:
    - knowledge/wiki/topics/**        # 昇格条件を満たさない結論をKnowledgeへ同期しない
    - knowledge/wiki/sources/**
    - projects/design-system/PROJECT.md
  must_preserve:
    - projects/design-system/docs/research/color-contrast-study.md
