name: decay-project-routing-clean
fixture: decay-clean
decay_pair: project-routing
decay_variant: clean

request: |
  現在進行中のロールアウト運用Projectの状態を確認して。

expect:
  route: project
  must_search:
    command: tools/find-context.sh
    status: active
  max_candidates: 5
  max_read_files: 12
  max_context_bytes: 32768
  max_escalations: 0
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/rollout-operations/PROJECT.md
    - projects/rollout-operations/STATE.md
  must_not_read:
    - projects/rollout-operations-2025/**
    - projects/rollout-operations-paused/**
    - projects/legacy-rollout/**
    - projects/brand-refresh/**
  must_not_reference:
    - projects/rollout-operations-2025/**
    - projects/rollout-operations-paused/**
    - projects/legacy-rollout/**
  must_not_write:
    - projects/**
  must_report:
    - current-project-state

report_match:
  current-project-state:
    - rollout-operations
    - 10%
