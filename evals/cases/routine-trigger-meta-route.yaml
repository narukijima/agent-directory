name: routine-trigger-meta-route

request: |
  Scheduler起点のMaintenance Routineとして、このWorkspaceの構造保守を実行して。

# RoutineはTriggerであり、新しいRouteとして扱わずmetaへ解決することを検証する。
expect:
  route: meta
  must_read:
    - AGENTS.md
    - routines/ROUTINES.md
    - routines/maintenance/ROUTINE.md
  must_report:
    - routine-is-a-trigger-not-a-route
    - same-route-owner-target-verify-rules-as-human-trigger
  must_not_write:
    - knowledge/raw/**
    - AGENTS.md
