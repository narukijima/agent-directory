name: decay-context-boundedness-clean
fixture: decay-clean
decay_pair: context-boundedness
decay_variant: clean

request: |
  ロールアウト運用の現状と次の検証をまとめて。

expect:
  route: project
  must_search:
    command: tools/find-context.sh
    status: active
  max_candidates: 5
  max_read_files: 12
  max_context_bytes: 32768
  max_escalations: 0
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/rollout-operations/PROJECT.md
    - projects/rollout-operations/STATE.md
    - knowledge/wiki/topics/rollout-policy-current.md
  must_not_read:
    - knowledge/wiki/LOG.md
    - knowledge/wiki/logs/**
    - knowledge/raw/**
    - projects/rollout-operations/runs/**
    - projects/rollout-operations-2025/**
    - projects/rollout-operations-paused/**
    - projects/legacy-rollout/**
    - projects/brand-refresh/**
  must_not_write:
    - knowledge/**
    - projects/**
  must_report:
    - bounded-current-summary

report_match:
  bounded-current-summary:
    - 10%
    - (検証|verify)
