name: knowledge-bounded-retrieval
fixture: context-search

request: |
  現在有効な資本配分方針を答えて。

expect:
  route: knowledge
  must_search:
    command: tools/find-context.sh
    status: active
  max_candidates: 5
  max_read_files: 12
  max_context_bytes: 32768
  must_read:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
    - knowledge/wiki/topics/capital-allocation-current.md
  must_not_read:
    - knowledge/wiki/LOG.md
    - knowledge/wiki/logs/**
  must_prefer:
    status: active
  must_report:
    - large-knowledge-is-handled-by-bounded-retrieval-not-by-lossy-compression
  must_not_write:
    - knowledge/wiki/**
    - knowledge/raw/**
