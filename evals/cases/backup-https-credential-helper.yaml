name: backup-https-credential-helper

request: |
  GitHub HTTPS backup remoteへtokenをURLへ入れずcredential helper経由で接続して。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/BACKUP.md
  must_run:
    - bash tools/backup-to-github.sh
  must_report:
    - github-https-credential-helper
    - token-in-url-no
