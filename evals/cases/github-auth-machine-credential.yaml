name: github-auth-machine-credential

request: |
  process tokenなしで、マシン共通credentialを使ってGitHub認証を検証して。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/TOOLS.md
  must_run:
    - bash tools/setup-github-auth.sh --check
  must_report:
    - source-machine-file
    - api-ok
    - git-ok
