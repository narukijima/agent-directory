    - projects/design-system/docs/QUALITY_SCORE.md   # 測定可能な評価軸
    - projects/design-system/STATE.md
  must_not_write:
    - projects/design-system/docs/PRODUCT_SENSE.md   # 数値合格条件とコマンドを置かない
    - projects/design-system/PROJECT.md
