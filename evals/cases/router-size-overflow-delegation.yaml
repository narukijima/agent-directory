name: router-size-overflow-delegation

request: |
  ルートのAGENTS.mdがサイズ上限を超えた。直しておいて。

# 圧縮・分割・上限拡大の選択を利用者へ返さず、重複除去と責務移管で解くことを検証する。
expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/TOOLS.md
  must_run:
    - bash tools/validate-agent-directory.sh
    - git commit
  must_report:
    - deduplicate-then-delegate-then-conditional-load-then-split
    - detail-moved-to-the-existing-owning-canon
    - meaning-prohibitions-exceptions-and-references-preserved
    - no-broken-references
    - size-limit-not-raised-to-make-the-validator-pass
    - no-approval-requested-for-a-reversible-internal-repair
    - commit-sha
  may_write:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
    - projects/PROJECTS.md
    - tools/TOOLS.md
    - tools/BACKUP.md
  must_preserve:
    - AGENTS.md#Route
    - AGENTS.md#人間へ上げる例外
    - tools/TOOLS.md#サイズ予算
  must_not_write:
    - knowledge/raw/**
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
