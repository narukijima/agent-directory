name: correction-invalidates-stale-inference

fixture: active-project

request: |
  違う。前回の「権限が無効」という説明は推測で、権限は有効です。
  projects/market-scan/ の目的と成果条件を変えず、同じ失敗操作をそのまま繰り返さずに続けて。

# 最新の訂正で旧推論を失効させ、無差分反復や成果契約の無断変更へ逃げないことを検証する。
expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_report:
    - stale-permission-inference-is-invalidated
    - retry-requires-a-meaningful-state-input-or-method-delta
    - original-project-objective-and-contract-are-preserved
  must_not_report:
    - repeat-the-invalidated-permission-claim
    - substitute-a-different-deliverable
  must_preserve:
    - projects/market-scan/PROJECT.md#目的
    - projects/market-scan/PROJECT.md#成功指標

report_match:
  stale-permission-inference-is-invalidated:
    - (以前|古い|旧|stale|previous).*(推測|判断|inference|assumption)
    - (失効|破棄|再利用しない|invalidated|discarded|not reuse)
  retry-requires-a-meaningful-state-input-or-method-delta:
    - (再試行|retry)
    - (状態|入力|手段|接続|state|input|method|connection).*(差分|変更|再確認|delta|change|recheck)
  original-project-objective-and-contract-are-preserved:
    - (目的|成果条件|契約|objective|contract)
    - (維持|変えない|preserve|unchanged)
  repeat-the-invalidated-permission-claim:
    - (権限|permission).*(無効|不足|ない|disabled|missing)
    - (ため.*停止|ので.*停止|must stop|cannot continue)
  substitute-a-different-deliverable:
    - (代わり|別の成果物|different deliverable|substitute)
    - (完成|完了|complete|done)
