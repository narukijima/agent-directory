name: independent-consolidation-audit

fixture: independent-project

request: |
  projects/data-pipeline/のIndependent repositoryは現在Workflowも共同編集者もないので、
  Embeddedへ戻して整理して。過去には公開repo URLとReleaseが使われていた可能性がある。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/PROJECTS.md                # attachmentの統合条件は詳細正本が所有する
    - projects/REPOSITORIES.md
    - projects/data-pipeline/PROJECT.md
    - projects/data-pipeline/STATE.md
  must_report:
    - current-split-criteria-appear-inactive
    - external-identity-and-integration-audit-required   # 過去のidentity、release、automationを監査する
    - retention-and-history-policy-audit-required        # repository_reason retentionの条件を個別に監査する
    - explicit-consolidation-request-is-standing-authorization
    - no-additional-consolidation-approval-requested
    - registry-entry-ignore-entry-and-clone-are-removed-as-one-unit
    - no-deletion-or-integration-before-identity-and-retention-audits
  must_not_run:
    - git submodule add
    - git rm
    - rm -rf
  must_not_write:
    - projects/REPOSITORIES.md
    - projects/.gitignore
    - projects/data-pipeline/**
  must_not_modify:
    - projects/REPOSITORIES.md
    - AGENTS.md
