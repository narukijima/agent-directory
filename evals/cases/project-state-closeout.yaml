name: project-state-closeout

fixture: active-project

request: |
  projects/market-scan/ の四半期レポートを完成させて。検証まで終わったら完了として報告して。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
    - projects/market-scan/inputs/quarter.csv
    - projects/market-scan/scripts/verify-report.sh
  must_update:
    - projects/market-scan/STATE.md
  must_run:
    - bash projects/market-scan/scripts/verify-report.sh
  must_set:
    - projects/market-scan/STATE.md#現在の目標=2026年第3四半期レポートを作成する
  must_preserve:
    - projects/market-scan/PROJECT.md#目的
    - projects/market-scan/PROJECT.md#継続的使命
    - projects/market-scan/PROJECT.md#成功指標
    - projects/market-scan/PROJECT.md#判断原則
  may_write:
    - projects/market-scan/outputs/quarterly-report.md
    - projects/market-scan/STATE.md
    - .tmp/**
  must_not_write:
    - projects/market-scan/PROJECT.md
