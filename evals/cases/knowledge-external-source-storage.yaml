name: knowledge-external-source-storage

request: |
  この論文PDFを取り込んで、あとで根拠として引けるようにしておいて。

expect:
  route: knowledge
  must_read:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
  may_write:
    - knowledge/raw/external/**       # 外部から取得した原資料の保存先
    - knowledge/wiki/sources/**       # 解釈は必ずWiki側へ分ける
    - .tmp/**
  must_not_write:
    - knowledge/raw/internal/**
    - knowledge/research/**           # 廃止済みの旧パスを復活させない
    - projects/**
    - knowledge/raw/external/**
  must_report:
    - external-source-stored-verbatim-with-provenance
