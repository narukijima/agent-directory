name: project-docs-design-entry

fixture: docs-project

request: |
  projects/design-system/ のコンポーネント分割の決まりを見直して、構造決定を更新して。

expect:
  route: project
  max_read_files: 12
  max_context_bytes: 32768
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/design-system/AGENTS.md
    - projects/design-system/PROJECT.md
    - projects/design-system/STATE.md
    - projects/design-system/docs/DESIGN.md      # 条件に一致した入口だけを読む
  must_not_read:
    - projects/design-system/docs/PRODUCT_SENSE.md
    - projects/design-system/docs/RESEARCH.md
    - projects/design-system/docs/research/color-contrast-study.md
    - projects/PROJECTS.md
  may_write:
    - projects/design-system/docs/DESIGN.md
    - projects/design-system/docs/design-docs/**
    - projects/design-system/STATE.md
  must_not_write:
    - projects/design-system/PROJECT.md
