name: project-agents-optional

fixture: finite-project

request: |
  projects/site-migration/ の移行作業を進めて。

expect:
  route: project
  must_read:                            # 個別AGENTS.mdが無いProjectでも通常どおり進む
    - AGENTS.md
    - projects/AGENTS.md
    - projects/site-migration/PROJECT.md
    - projects/site-migration/STATE.md
  must_not_read:
    - projects/PROJECTS.md
  must_update:
    - projects/site-migration/STATE.md
  must_run:
    - bash projects/site-migration/scripts/verify-migration.sh
  may_write:
    - projects/site-migration/outputs/**
    - projects/site-migration/STATE.md
    - .tmp/**
  must_not_write:
    - projects/site-migration/AGENTS.md   # 差分が無いProjectへ空の階層を新設しない
    - projects/site-migration/CLAUDE.md
    - projects/_template/AGENTS.md
    - projects/site-migration/PROJECT.md
