name: project-work-scoped-validation

fixture: active-project

request: |
  projects/market-scan/ のSTATE.mdを最新の到達点で更新して。

# 通常のProject work/stateが構造検証を必要とする場合は、全体validatorではなく
# 対象・差分検証（--changed）を使い、full validatorと無関係fixtureを実行しない。
expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_update:
    - projects/market-scan/STATE.md
  must_run:
    - bash tools/validate-agent-directory.sh --changed
  must_not_run:
    - bash tools/validate-agent-directory.sh --full
    - git push
  may_write:
    - projects/market-scan/STATE.md
  must_not_write:
    - projects/market-scan/PROJECT.md
