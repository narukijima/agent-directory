name: upstream-auth-repair-once

request: |
  上流Issue送信で認証probeが失敗した。安全なrepairと再試行を行って。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/UPSTREAM.md
  must_run:
    - bash tools/setup-github-auth.sh --repair-from-gh
    - bash tools/report-upstream-issue.sh
  must_report:
    - repair-attempts-one
    - report-retries-one
