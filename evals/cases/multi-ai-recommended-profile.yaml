name: multi-ai-recommended-profile

fixture: active-project

request: |
  projects/market-scan/ ではCodex、Claude Code、ChatGPT、Pythonを利用できます。
  週次の調査、記事制作、必要に応じた画像制作、
  公開、metrics回収、次週改善までを継続運用するProjectの責任分担を設計してください。
  特定モデルを必須にはせず、画像が不要な週と単一runtimeしか使えない場合も扱ってください。
  scheduled runでClaude CLIの認証が失効した場合と、公開処理の途中でdelegateが停止した場合に、
  objectiveを失わず重複送信もしない引継ぎを含めてください。品質不足はavailability failureと区別してください。

# Recommended Profileがcapability-firstの初期案として使われ、Provider必須仕様やscheduler実装に
# 変形されないことを検証する。
expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
    - OPERATING_PROFILE.md
  must_report:
    - human-remains-ultimate-authority
    - codex-recommended-as-control-plane-not-required
    - claude-code-recommended-as-creative-production-worker-not-required
    - chatgpt-is-an-optional-visual-worker-with-no-invented-direct-adapter
    - deterministic-tools-own-publish-metrics-validation-and-protocols
    - repository-remains-canonical-state
    - one-primary-owner-per-responsibility
    - scheduled-execution-remains-an-external-trigger-for-the-normal-task-lifecycle
    - single-runtime-responsibilities-may-be-combined-and-role-change-is-explicit
    - declared-claude-cli-availability-fallback-to-codex-is-not-silent-quality-fallback
    - automated-fallback-does-not-route-through-claude-desktop
    - partial-execution-state-and-external-effects-are-checked-before-writer-transfer
    - requested-owner-actual-owner-fallback-reason-and-completion-state-are-recorded
    - claude-required-project-contract-stops-instead-of-falling-back
  may_write:
    - projects/**
