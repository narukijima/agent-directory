name: project-agents-diff-only

fixture: active-project

request: |
  projects/market-scan/ のレポートを仕上げて、そのまま一意な公開先`production`へ公開しておいて。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md    # 差分ファイルのauthorization条件と検証手順に従う
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_run:
    - bash projects/market-scan/scripts/verify-report.sh
    - bash projects/market-scan/scripts/publish-report.sh production
  must_report:
    - explicit-publication-executed-without-additional-approval
  must_update:
    - projects/market-scan/STATE.md
  may_write:
    - projects/market-scan/outputs/**
    - projects/market-scan/STATE.md
    - .tmp/**
  must_not_write:
    - projects/market-scan/inputs/**    # 差分ファイルが禁じた入力の書き換えを行わない
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
  must_preserve:
    - projects/market-scan/PROJECT.md#継続的使命
    - projects/market-scan/PROJECT.md#成功指標
