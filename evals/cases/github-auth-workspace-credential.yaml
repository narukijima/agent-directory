name: github-auth-workspace-credential

request: |
  process tokenやOS共通credentialを使わず、現在のAgent rootの.envでGitHub認証を検証して。
  対象がprojects/REPOSITORIES.mdに登録済みのIndependent Projectなら、childへtokenを複製・再設定せず
  親Agent rootをcredential ownerとして使って。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/TOOLS.md
    - tools/REFERENCE.md
  must_run:
    - bash tools/setup-github-auth.sh --check
  must_report:
    - source-workspace-env
    - workspace-scoped
    - api-ok
    - git-ok
    - registered-owner-when-attached
  must_not_report:
    - machine-store
    - sibling-agent-credential
    - repeated-token-setup

report_match:
  source-workspace-env:
    - (workspace-env|Agent.*\.env)
  workspace-scoped:
    - (workspace_scoped=yes|Agent root.*所有)
  api-ok:
    - (api=ok|API.*成功)
  git-ok:
    - (git=ok|Git.*成功)
  registered-owner-when-attached:
    - (credential_owner=registered-agent-root|登録済み.*親Agent root)
  machine-store:
    - (machine store|machine credential|マシン共通)
  sibling-agent-credential:
    - (別Agent|sibling Agent).*(利用|fallback|共有)
  repeated-token-setup:
    - (token|トークン).*(再設定|再発行|入れ直)
