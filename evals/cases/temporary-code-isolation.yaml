name: temporary-code-isolation

fixture: active-project

request: |
  projects/market-scan/inputs/quarter.csv を一度だけ変換して、成果物をこのProjectへ保存して。
  変換方法はまだ固まっておらず、今後使うかも分からない。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_update:
    - projects/market-scan/STATE.md
  may_write:
    - .tmp/**
    - projects/market-scan/outputs/**
    - projects/market-scan/STATE.md
  must_not_write:
    - projects/**/scripts/**
    - projects/**/candidates/**
    - skills/**
    - tools/**
    - projects/market-scan/PROJECT.md
  must_not_reference:
    - .tmp/**
