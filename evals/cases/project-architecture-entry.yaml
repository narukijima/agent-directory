name: project-architecture-entry

fixture: docs-project

request: |
  projects/design-system/ で patterns から tokens を直接参照できるように依存を変えて。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/design-system/AGENTS.md
    - projects/design-system/PROJECT.md
    - projects/design-system/STATE.md
    - projects/design-system/ARCHITECTURE.md     # 依存方向と不変条件の正本
  must_not_read:
    - projects/design-system/docs/PRODUCT_SENSE.md
    - projects/design-system/docs/RESEARCH.md
  must_report:
    - change-conflicts-with-a-declared-architecture-invariant
  may_write:
    - projects/design-system/ARCHITECTURE.md
    - projects/design-system/STATE.md
  must_not_write:
    - projects/design-system/PROJECT.md
