name: decay-explicit-target-clean
fixture: decay-clean
decay_pair: explicit-target
decay_variant: clean

request: |
  projects/rollout-operations/STATE.md を確認して、現在の目標を答えて。

expect:
  route: project
  must_not_search:
    command: tools/find-context.sh
  max_read_files: 12
  max_context_bytes: 32768
  max_escalations: 0
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/rollout-operations/PROJECT.md
    - projects/rollout-operations/STATE.md
  must_not_read:
    - projects/rollout-operations-2025/**
    - projects/rollout-operations-paused/**
    - projects/legacy-rollout/**
  must_not_write:
    - projects/**
  must_report:
    - explicit-target-goal

report_match:
  explicit-target-goal:
    - 10%
    - (検証|verify|canary)
