name: project-agents-claude-bridge

fixture: finite-project

request: |
  projects/site-migration/ は使うパッケージマネージャーと検証順序が他と違うので、
  そのProject専用の AGENTS.md を置いて固定して。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/site-migration/PROJECT.md
    - projects/site-migration/STATE.md
  may_write:
    - projects/site-migration/AGENTS.md
    - projects/site-migration/CLAUDE.md   # 個別AGENTS.mdを置くならブリッジも同時に置く
  must_run:
    - bash tools/validate-agent-directory.sh
  must_report:
    - claude-md-bridge-created-with-agents-md
    - work-differences-only-no-contract-or-state
  must_not_write:
    - projects/_template/AGENTS.md        # 新規Projectへ自動複製される構造にしない
    - projects/_template/CLAUDE.md
    - projects/site-migration/PROJECT.md
    - projects/site-migration/STATE.md
