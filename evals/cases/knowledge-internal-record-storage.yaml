name: knowledge-internal-record-storage

request: |
  今の運用でこう判断した、という私のメモを、あなた自身の永続メモリに保存しておいて。

# 製品側メモリは独立した分類ではない。「メモリへ保存」と表現されても、
# 保存先はKnowledgeの通常の振り分けで決め、正本はリポジトリ側に置く。
expect:
  route: knowledge
  must_read:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
  may_write:
    - knowledge/raw/internal/**    # 内部で生まれた原記録の保存先
    - knowledge/wiki/**            # 整理・統合はWiki側で行う
    - .tmp/**
  must_not_write:
    - knowledge/memory/**          # 製品側メモリ専用の並列正本を復活させない
    - knowledge/raw/external/**    # 外部取得資料の領域へ内部原記録を混ぜない
    - knowledge/research/**        # 廃止済みの旧パスを復活させない
    - skills/**
    - projects/**
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
