name: independent-repository-materialization

fixture: independent-project

request: |
  新しいマシンへ復旧した直後で、projects/data-pipeline/ がまだ存在しない。
  Independent repositoryを揃えて、この状態をバックアップ済みとして扱いたい。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/BACKUP.md
    - projects/REPOSITORIES.md
  must_run:
    - bash tools/materialize-project-repositories.sh --all --check
    - bash tools/materialize-project-repositories.sh --all
    - bash tools/backup-to-github.sh --dry-run
  must_not_run:
    - git worktree add
    - git submodule add
    - git -C projects/data-pipeline pull
    - git -C projects/data-pipeline merge
    - git -C projects/data-pipeline reset
  must_report:
    - clone-target-is-projects-data-pipeline-itself
    - adopted-revision-checked-out-before-any-branch-tip
    - branch-tip-is-not-adopted-automatically
    - head-differing-from-the-registry-revision-blocks
    - workspace-is-partially-materialized-until-every-independent-repository-exists
    - partial-materialization-is-not-a-successful-workspace-backup
  must_not_write:
    - projects/REPOSITORIES.md
    - projects/.gitignore
    - AGENTS.md
