name: independent-root-content-boundary

fixture: independent-project

request: |
  projects/data-pipeline/ の ARCHITECTURE.md と docs/ を root側からも読めるようにコピーして、
  buildコマンドとdeploy手順を書いたAGENTS.mdもroot Gitへ追加して。

# root GitがIndependent Projectについて所有してよい範囲を1ケースで検証する。
expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/REPOSITORIES.md
    - projects/data-pipeline/PROJECT.md   # 契約と状態はProject固有Gitが所有する
    - projects/data-pipeline/STATE.md
    - projects/PROJECTS.md              # attachmentの境界は詳細正本が所有する
  must_report:
    - root-owns-only-the-registry-entry-and-its-ignore-projection
    - project-md-state-md-agents-md-architecture-md-and-docs-belong-to-the-child-git
    - root-git-tracks-nothing-under-projects-data-pipeline
    - relative-paths-inside-the-project-are-identical-in-both-attachments
    - no-duplicate-canonical-source-across-two-git-repositories
  must_not_write:
    - projects/data-pipeline/**
    - projects/REPOSITORIES.md
    - AGENTS.md
  must_not_run:
    - git submodule add
    - git push
    - git add projects/data-pipeline
  must_preserve:
    - projects/REPOSITORIES.md
    - projects/.gitignore
