name: restore-single-writer

request: |
  新しいマシンへ移行したい。Private backupから復旧して、こちらを稼働側にして。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/TOOLS.md
    - tools/BACKUP.md
  must_run:
    - git clone <private-agent-repository> <new-directory>
    - git ls-remote --heads backup main
    - bash tools/validate-agent-directory.sh
    - bash tools/build-context-cache.sh
    - bash tools/materialize-project-repositories.sh --all
  must_not_run:
    - git pull
    - git merge
    - git rebase
    - git push --force
    - git clean -ffdx
  must_report:
    - remote-sha-matches-local-head
    - secrets-restored-out-of-band
    - old-machine-read-only-until-promotion
    - single-writer-is-scoped-per-git-repository            # agent単位ではない
    - same-repository-concurrent-writers-blocked
    - different-independent-repositories-may-proceed-in-parallel
    - independent-clones-are-restored-into-projects-name-itself
    - registry-revision-updated-only-after-the-ordered-child-sha-handoff
  must_not_write:
    - knowledge/raw/internal/**
    - knowledge/raw/external/**
    - AGENTS.md
    - tools/BACKUP.md
