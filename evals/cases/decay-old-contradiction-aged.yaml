name: decay-old-contradiction-aged
fixture: decay-aged
decay_pair: old-contradiction
decay_variant: aged
decay_stale_check: true

request: |
  ロールアウトは検証なしで即時100%へ変更済みですか。現在の正本だけで答えて。

expect:
  route: knowledge
  must_search:
    command: tools/find-context.sh
    status: active
  max_candidates: 5
  max_read_files: 12
  max_context_bytes: 32768
  max_escalations: 0
  must_read:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
    - knowledge/wiki/topics/rollout-policy-current.md
  must_not_read:
    - knowledge/wiki/topics/rollout-policy-old.md
    - knowledge/wiki/LOG.md
    - knowledge/wiki/logs/**
  must_not_reference:
    - knowledge/wiki/topics/rollout-policy-old.md
  must_not_write:
    - knowledge/**
  must_report:
    - contradiction-resolved-by-current-canon

report_match:
  contradiction-resolved-by-current-canon:
    - (いいえ|未変更|not)
    - 10%
