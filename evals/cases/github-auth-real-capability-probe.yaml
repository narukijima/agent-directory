name: github-auth-real-capability-probe

request: |
  gh auth statusや環境変数表示ではなく、実APIと実remote readで利用可否を判定して。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/REFERENCE.md
  must_run:
    - bash tools/setup-github-auth.sh --check
  must_not_run:
    - env | grep GH_TOKEN
    - gh auth status
  must_report:
    - actual-api-capability
    - actual-git-capability
