name: decay-knowledge-current-clean
fixture: decay-clean
decay_pair: knowledge-current
decay_variant: clean
decay_stale_check: true

request: |
  現在有効なロールアウト方針を答えて。

expect:
  route: knowledge
  must_search:
    command: tools/find-context.sh
    status: active
  max_candidates: 5
  max_read_files: 12
  max_context_bytes: 32768
  max_escalations: 0
  must_read:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
    - knowledge/wiki/topics/rollout-policy-current.md
  must_not_read:
    - knowledge/wiki/topics/rollout-policy-old.md
    - knowledge/wiki/topics/rollout-policy-archive.md
    - knowledge/wiki/topics/rollout-policy-retired.md
    - knowledge/wiki/LOG.md
    - knowledge/wiki/logs/**
    - knowledge/raw/**
  must_prefer:
    status: active
  must_not_reference:
    - knowledge/wiki/topics/rollout-policy-old.md
    - knowledge/wiki/topics/rollout-policy-archive.md
    - knowledge/wiki/topics/rollout-policy-retired.md
  must_not_write:
    - knowledge/**
  must_report:
    - current-policy-answer

report_match:
  current-policy-answer:
    - 10%
    - (段階|phased|canary)
