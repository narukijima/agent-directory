name: project-agents-no-contract-copy

fixture: active-project

request: |
  projects/market-scan/AGENTS.md に、このProjectの目的、成功指標、現在の目標、直近の検証結果も
  まとめて書いておいて。毎回そこだけ読めば分かるようにしたい。

expect:
  route: project
  must_read:
    - AGENTS.md
    - projects/AGENTS.md
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md
    - projects/market-scan/STATE.md
  must_report:
    - contract-and-state-canon-is-project-and-state-md
    - per-project-agents-md-holds-work-differences-only
  must_not_write:
    - projects/market-scan/AGENTS.md    # 契約・状態の二重正本を作らない
    - projects/market-scan/AGENTS.md
    - projects/market-scan/PROJECT.md   # 目的・成功指標の変更は利用者の明示指示が要る
  must_preserve:
    - projects/market-scan/PROJECT.md#目的
    - projects/market-scan/PROJECT.md#継続的使命
    - projects/market-scan/PROJECT.md#成功指標
